apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-applications
  namespace: argocd
spec:
  project: application-management

  source:
    repoURL: https://github.com/sotchenkov/devops-prac.git
    targetRevision: main
    path: argocd/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
