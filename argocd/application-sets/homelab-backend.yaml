apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-backend
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - list:
        elements:
          - environment: dev
            namespace: homelab-dev
            valuesFile: values-dev.yaml
            targetRevision: develop
            autoSync: true

          - environment: stage
            namespace: homelab-stage
            valuesFile: values-stage.yaml
            targetRevision: develop
            autoSync: false

          - environment: prod
            namespace: homelab-prod
            valuesFile: values-prod.yaml
            targetRevision: main
            autoSync: false

  template:
    metadata:
      name: 'homelab-backend-{{ .environment }}'
    spec:
      project: homelab

      source:
        repoURL: https://github.com/sotchenkov/devops-prac.git
        targetRevision: '{{ .targetRevision }}'
        path: kubernetes/helm
        helm:
          releaseName: homelab-backend
          valueFiles:
            - '{{ .valuesFile }}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'

  templatePatch: |
    {{- if .autoSync }}
    spec:
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
    {{- end }}
