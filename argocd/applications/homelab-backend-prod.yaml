apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-backend-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/sotchenkov/devops-prac.git
    targetRevision: main
    path: kubernetes/helm
    helm:
      releaseName: homelab-backend
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: homelab-prod
