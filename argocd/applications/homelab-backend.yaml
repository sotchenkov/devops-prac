apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-backend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sotchenkov/devops-prac.git
    targetRevision: main
    path: kubernetes/helm
    helm:
      releaseName: homelab-backend
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: homelab