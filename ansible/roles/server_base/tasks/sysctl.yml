- name: Create sysctl configuration file
  ansible.builtin.file:
    path: /etc/sysctl.d/server-base.conf
    owner: root
    group: root
    mode: '0644'
    state: touch
    modification_time: preserve
    access_time: preserve

- name: Configure kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/server-base.conf
    state: present
    sysctl_set: true
  loop: "{{ server_base_sysctl_parameters | dict2items }}"