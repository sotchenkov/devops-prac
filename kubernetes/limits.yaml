apiVersion: v1
kind: LimitRange
metadata:
  name: homelab-container-limits
  namespace: homelab
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "0.1"
        memory: 128Mi
      default:
        cpu: "0.5"
        memory: 256Mi

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: homelab-resources-quota
  namespace: homelab
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2.5"
    limits.memory: 1.5Gi
    pods: "6"
