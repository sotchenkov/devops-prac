apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-backend-app
  namespace: homelab
  labels:
    app.kubernetes.io/name: app-backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: app-backend
  template:
    metadata:
      annotations:
        devops-prac.local/config-revision: "3"
      labels:
        app.kubernetes.io/name: app-backend
    spec:
      serviceAccountName: homelab-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
        - name: backend
          image: app-backend:v1.1
          imagePullPolicy: Never
          env:
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: homelab-backend-env
                  key: APP_ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: homelab-backend-env
                  key: LOG_LEVEL
            - name: STARTUP_DELAY
              valueFrom:
                configMapKeyRef:
                  name: homelab-backend-env
                  key: STARTUP_DELAY
            - name: SHUTDOWN_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: homelab-backend-env
                  key: SHUTDOWN_TIMEOUT
            - name: METRICS_AUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: homelab-backend-env
                  key: METRICS_AUTH_ENABLED
            - name: METRICS_TOKEN_FILE
              valueFrom:
                configMapKeyRef:
                  name: homelab-backend-env
                  key: METRICS_TOKEN_FILE
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/secrets
              readOnly: true
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          startupProbe:
            httpGet:
              path: "/health/ready"
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: "/health/ready"
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: "/health/live"
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: runtime-secrets
          secret:
            secretName: homelab-backend-runtime
            defaultMode: 0444
