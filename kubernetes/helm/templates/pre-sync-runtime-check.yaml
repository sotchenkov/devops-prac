apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-pre-sync-runtime-check
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pre-sync-runtime-check
          image: {{ .Values.hooks.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - "test"
            - "-s"
            - "/run/secrets/BEARER_TOKEN"
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/secrets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
      volumes:
        - name: runtime-secrets
          secret:
            secretName: homelab-backend-runtime
            defaultMode: 0444
  backoffLimit: 0
  activeDeadlineSeconds: 60
