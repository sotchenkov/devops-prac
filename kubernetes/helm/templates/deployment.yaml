{{- $imageReference := printf "%s:%s" .Values.image.repository .Values.image.tag }}
{{- if .Values.image.digest }}
{{- $imageReference = printf "%s@%s" .Values.image.repository .Values.image.digest }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "homelab-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "homelab-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config-map.yaml") . | sha256sum | quote }}
      labels:
        {{- include "homelab-backend.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
        - name: backend
          image: {{ $imageReference | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          env:
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-env
                  key: APP_ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-env
                  key: LOG_LEVEL
            - name: STARTUP_DELAY
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-env
                  key: STARTUP_DELAY
            - name: SHUTDOWN_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-env
                  key: SHUTDOWN_TIMEOUT
            - name: METRICS_AUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-env
                  key: METRICS_AUTH_ENABLED
            - name: METRICS_TOKEN_FILE
              value: "/run/secrets/BEARER_TOKEN"
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/secrets
              readOnly: true
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: "/health/ready"
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: "/health/ready"
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: "/health/live"
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: runtime-secrets
          secret:
            secretName: homelab-backend-runtime
            defaultMode: 0444
