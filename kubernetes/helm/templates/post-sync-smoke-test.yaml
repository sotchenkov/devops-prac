apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-post-sync-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: post-sync-smoke-test
          image: {{ .Values.hooks.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - "wget"
            - "--spider"
            - "-T"
            - "5"
            - "http://{{ .Release.Name }}-service:{{ .Values.service.port }}/health/ready"
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
  backoffLimit: 0
  activeDeadlineSeconds: 60
