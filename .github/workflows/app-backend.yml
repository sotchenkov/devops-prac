name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/backend/**"
      - ".github/workflows/app-backend.yml"

  push:
    branches:
      - main
    paths:
      - "app/backend/**"
      - ".github/workflows/app-backend.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: app/backend/go.mod

      - name: Run static analysis
        run: go vet ./...
      
      - name: Run tests
        run: go test -race -cover -count=1 ./...

  build:
    runs-on: ubuntu-24.04
    needs: test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
             
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: app/backend
          push: false
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/app-backend.tar
          tags: app-backend:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}

      - name: Upload OCI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-backend-image
          path: ${{ runner.temp }}/app-backend.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  security-scan:
    name: Security scan (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    needs: build
    
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Download OCI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-backend-image
          path: ${{ runner.temp }}
    
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          version: v0.73.0
          scan-type: image
          input: ${{ runner.temp }}/app-backend.tar
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          cache: true