name: Helm CI

on:
  push:
    branches:
      - main
    paths:
      - "kubernetes/helm/**"
      - "kubernetes/cluster/kind.yaml"
      - ".github/workflows/helm.yml"

  pull_request:
    branches:
      - main
    paths:
      - "kubernetes/helm/**"
      - "kubernetes/cluster/kind.yaml"
      - ".github/workflows/helm.yml"

permissions:
  contents: read

env:
  HELM_VERSION: v4.2.3
  KUBERNETES_VERSION: "1.36.1"

jobs:
  validate:
    name: validate ${{ matrix.environment }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - stage
          - prod

    defaults:
      run:
        shell: bash
        working-directory: kubernetes

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint chart
        run: helm lint helm/ --values helm/values-${{ matrix.environment }}.yaml --strict

      - name: Render chart
        run: |
          helm template homelab-backend helm/ \
            --namespace homelab \
            --values helm/values-${{ matrix.environment }}.yaml \
            --kube-version "$KUBERNETES_VERSION" \
            > "$GITHUB_WORKSPACE/.helm-rendered-${{ matrix.environment }}.yaml"

      - name: Validate manifests
        uses: docker://ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e # v0.8.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            -kubernetes-version ${{ env.KUBERNETES_VERSION }}
            /github/workspace/.helm-rendered-${{ matrix.environment }}.yaml

      - name: Scan manifests for misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: config
          scan-ref: .helm-rendered-${{ matrix.environment }}.yaml
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"