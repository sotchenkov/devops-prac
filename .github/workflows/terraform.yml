name: Terraform CI

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"


defaults:
  run:
    shell: bash
    working-directory: ./terraform

jobs:
  terraform-check:
     runs-on: ubuntu-24.04
     permissions:
       contents: read
     env:
       TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-provider-cache
     steps:
       - name: Checkout repository
         uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

       - name: Create Terraform plugin cache directory
         run: mkdir --parents "$TF_PLUGIN_CACHE_DIR"

       - name: Cache Terraform providers
         uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
         with:
           path: ${{ env.TF_PLUGIN_CACHE_DIR }}
           key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}

       - name: Setup Terraform
         uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
         with:
           terraform_version: 1.15.8

       - name: Setup TFLint
         uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
         with:
           tflint_version: v0.64.0

       - name: Run Terraform init
         run: make terraform-init

       - name: Run Terraform check
         run: make terraform-check

       - name: Run TFLint
         run: tflint --recursive --format compact

       - name: Run tests
         run: make terraform-test

       - name: Security check
         uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
         with:
           scan-type: config
           scan-ref: terraform
           severity: HIGH,CRITICAL
           exit-code: 1
           format: table
           hide-progress: true
