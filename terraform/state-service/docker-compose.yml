name: terraform-state

services:
  terraform-state-db:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    container_name: terraform-state-db
    restart: unless-stopped
    init: true

    environment:
      POSTGRES_DB: terraform_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256

      TERRAFORM_DB_USER: ${TERRAFORM_DB_USER:-terraform_backend_runtime}
      TERRAFORM_DB_PASSWORD: ${TERRAFORM_DB_PASSWORD:?Set TERRAFORM_DB_PASSWORD in .env}

      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "127.0.0.1:${TERRAFORM_STATE_DB_PORT:-15432}:5432"

    volumes:
      - terraform-state-db-data:/var/lib/postgresql/data
      - ./init/10-create-terraform-runtime-role.sh:/usr/local/bin/bootstrap-state-backend.sh:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          --quiet
          --username="$${POSTGRES_USER}"
          --dbname="$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

    stop_grace_period: 30s

volumes:
  terraform-state-db-data:
    name: terraform-state-db-data
